<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Oceania Level 0</title><meta name="description" content="Mark your travel levels across Oceania’s 14 sovereign countries."><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b4264'/%3E%3Cpath d='M6 12h8v8H6zm12-5h8v8h-8zm0 12h8v8h-8z' fill='%236ee7cf'/%3E%3C/svg%3E"><style>html,body{height:100%;margin:0;overflow:hidden;color:#111;background:#F9CDC7;font-family:Arial,Helvetica,sans-serif}*{box-sizing:border-box}button,a{font:inherit;color:#111}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #111;outline-offset:3px}#oceania-map{width:100%;height:100%;display:block}footer{position:fixed;right:16px;bottom:max(16px,env(safe-area-inset-bottom));display:flex;align-items:center;gap:8px;font-size:16px}footer button,footer .language{border:2px solid #111;border-radius:3px;padding:5px 8px;background:white;line-height:24px}footer #reset{background:#ffffbb}footer .language{cursor:default}dialog{color:#111;background:#fff;border:3px solid #111;border-radius:4px;padding:20px;box-shadow:3px 6px 0 #0002;width:350px;max-width:calc(100vw - 20px)}dialog::backdrop{background:#ffffffb8}dialog h2{margin:0 25px 14px 0;font-size:24px;font-weight:400}dialog p{line-height:1.5;font-size:16px}.close{position:absolute;right:7px;top:6px;border:0;background:transparent;font-size:22px;padding:0 5px}.action{background:#fff;border:2px solid #111;border-radius:3px;padding:7px 12px;text-decoration:none;display:inline-block}.dialog-actions{display:flex;justify-content:flex-end;gap:10px}#picker{position:fixed;inset:auto;margin:0;padding:0;width:250px;max-height:calc(100dvh - 20px);overflow:auto}#picker h2{font-size:24px;line-height:1.3;text-align:center;padding:12px 25px 12px 10px;margin:0}#picker p{display:none}.choices{display:flex;flex-direction:column}.choice{border:0;border-radius:0;text-align:center;padding:8px 10px;font-size:18px;line-height:24px}.choice span:last-child{display:none}.choice[aria-pressed=true]{box-shadow:inset 0 0 0 2px #111}.l5{background:#FF7E7E}.l4{background:#FFB57E}.l3{background:#FFE57E}.l2{background:#A8FFBE}.l1{background:#88AEFF}.lw{background:#d6beff}.l0{background:#fff}#save-dialog{width:100vw;height:100dvh;max-width:100vw;max-height:100dvh;border:0;margin:0;inset:0;border-radius:0;text-align:center;box-shadow:none;padding:22px;overflow:auto}#save-dialog h2{display:none}#save-image{display:block;max-width:94vw;max-height:72dvh;width:auto;height:auto;margin:20px auto;box-shadow:0 5px 20px #0002}#download-link{display:inline-block}#notice{position:fixed;left:12px;bottom:10px;font-size:14px;pointer-events:none}#notice:empty{display:none}@media(max-width:800px),(max-height:800px){footer{right:10px;bottom:10px;font-size:14px;gap:6px}footer button,footer .language{padding:4px 7px}#picker{width:190px;border-width:2px}#picker h2{font-size:18px}.choice{font-size:16px;padding:6px 8px;line-height:22px}}</style></head><body><svg id="oceania-map" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1350 760" width="1350" height="760" aria-label="Simplified interactive map of Oceania’s 14 sovereign countries"><style>text{font-family:Arial,Helvetica,sans-serif}.map-country{cursor:pointer;outline:none}.region{stroke:#222;stroke-width:1.5;stroke-dasharray:6 5;stroke-linejoin:round}.continent{stroke:#111;stroke-width:2.5;stroke-linejoin:round}.island{stroke:#222;stroke-width:1.1;stroke-linejoin:round;pointer-events:none}.name-label{fill:#000;font-size:19px;font-weight:400;text-anchor:middle;pointer-events:all}.map-country:hover .region,.map-country:focus .region{stroke:#111;stroke-width:3}.map-country:hover .continent,.map-country:focus .continent{stroke-width:4}</style><rect id="map-background" width="1350" height="760" fill="#F9CDC7"/><g transform="translate(250 0)"><g cl "600" y="261"><tspan x="600" dy="0">Nauru</tspan></text></g><g class="map-country" data-country="SB" role="button" tabindex="0" aria-label="Solomon Islands: Never been Here. Choose travel level."><title>Solomon Islands</title><path class="region" d="M485 290H550V290H650L680 390H555L490 345Z" fill="#fff"/><path class="island" d="M518 350l16 6 8 9-5 4-18-11ZM562 357l13 4 7 9-6 3-12-9ZM619 371l8 4 3 7-7-1Z"/><text class="name-label" style="font-size:17px" x="586" y="332"><tspan x="586" dy="0">Solomon Islands</tspan></text></g><g class="map-country" data-country="VU" role="button" tabindex="0" aria-label="Vanuatu: Never been Here. Choose travel level."><title>Vanuatu</title><path class="region" d="M555 390H680V490H555Z" fill="#fff"/><path class="island" d="M590 451l6-6 5 7-4 9ZM607 471l6 3-2 7-5-2Z"/><text class="name-label" x="610" y="433"><tspan x="610" dy="0">Vanuatu</tspan></text></g><g class="map-country" data-country="TV" role="button" tabindex="0" aria-label="Tuvalu: Never been Here. Choose travel level."><title>Tuvalu</title><path class="region" d="M650 290H790V390H680Z" fill="#fff"/><path class="island" d="M704 355l4-3 3 4-4 2ZM738 374l3-2 3 3-4 2Z"/><text class="name-label" x="725" y="334"><tspan x="725" dy="0">Tuvalu</tspan></text></g><g class="map-country" data-country="FJ" role="button" tabindex="0" aria-label="Fiji: Never been Here. Choose travel level."><title>Fiji</title><path class="region" d="M680 390H790L830 490H680Z" fill="#fff"/><path class="island" d="M712 459l14-7 10 8-9 11-13-3ZM749 454l13-5 7 5-12 5Z"/><text class="name-label" x="738" y="441"><tspan x="738" dy="0">Fiji</tspan></text></g><g class="map-country" data-country="WS" role="button" tabindex="0" aria-label="Samoa: Never been Here. Choose travel level."><title>Samoa</title><path class="region" d="M790 330H910V415H790Z" fill="#fff"/><path class="island" d="M834 390l12-5 8 5-8 4ZM856 396l8-3 5 3-6 3Z"/><text class="name-label" x="849" y="366"><tspan x="849" dy="0">Samoa</tspan></text></g><g class="map-country" data-country="TO" role="button" tabindex="0" aria-label="Tonga: Never been Here. Choose travel level."><title>Tonga</title><path class="region" d="M830 415H910V525H830Z" fill="#fff"/><path class="island" d="M862 480l4-4 3 6-3 4ZM874 500l3-3 2 5-3 3Z"/><text class="name-label" x="870" y="459"><tspan x="870" dy="0">Tonga</tspan></text></g><g class="map-country" data-country="KI" role="button" tabindex="0" aria-label="Kiribati: Never been Here. Choose travel level."><title>Kiribati</title><path class="region" d="M790 110H1040V330H910V275H790V230H650V205H790Z" fill="#fff"/><path class="island" d="M820 158l3-4 3 4-2 4ZM964 258l4-2 3 4-5 2ZM1011 280l6-2 4 3-7 3Z"/><text class="name-label" x="920" y="214"><tspan x="920" dy="0">Kiribati</tspan></text></g><g class="map-country" data-country="AU" role="button" tabindex="0" aria-label="Australia: Never been Here. Choose travel level."><title>Australia</title><path class="continent" d="M77 439L122 404 178 399 218 361 262 377 290 351 320 371 345 363 373 400 397 409 420 395 444 431 469 472 478 529 465 561 448 571 429 598 392 600 363 575 320 584 298 569 244 579 206 585 160 567 123 570 86 546 75 500Z M395 623L420 631 416 654 399 650Z" fill="#fff"/><text class="name-label" x="268" y="483"><tspan x="268" dy="0">Australia</tspan></text></g><g class="map-country" data-country="NZ" role="button" tabindex="0" aria-label="New Zealand: Never been Here. Choose travel level."><title>New Zealand</title><path class="continent" d="M679 574L689 546 702 527 709 507 721 514 716 541 732 551 723 572 706 587 690 592Z M682 590L669 611 643 629 626 650 596 667 580 656 604 643 625 617 650 609 666 589Z" fill="#fff"/><text class="name-label" x="660" y="685"><tspan x="660" dy="0">New Zealand</tspan></text></g></g><text id="map-total" x="35" y="250" style="font-size:46px;fill:#111;font-weight:400">Oceania Level 0</text><g id="map-legend" transform="translate(35 435)"></g></svg><footer><button id="reset">Reset</button><button id="save">Save</button></footer><p id="notice" role="status" aria-live="polite"></p><dialog id="picker" aria-labelledby="picker-title"><button class="close" aria-label="Close" data-close>×</button><h2 id="picker-title"></h2><p>Choose your highest travel level.</p><div class="choices" id="choices"></div></dialog>
<dialog id="reset-dialog" aria-labelledby="reset-title"><button class="close" aria-label="Close" data-close>×</button><h2 id="reset-title">Reset your travels?</h2><p>This will clear all 14 countries on this browser.</p><div class="dialog-actions"><button class="action" data-close>Cancel</button><button class="action primary" id="confirm-reset">Reset all</button></div></dialog>
<dialog id="save-dialog" aria-labelledby="save-title"><button class="close" aria-label="Close" data-close>×</button><h2 id="save-title">Your Oceania travel chart</h2><img id="save-image" alt="Your Oceania travel level chart"><a id="download-link" class="action primary" download="oceania-travel-levels.png">Download PNG</a><p>On mobile, you can also press and hold the image to save it.</p></dialog>
<script>const countries=[['PW','Palau'],['FM','Federated States of Micronesia'],['MH','Marshall Islands'],['KI','Kiribati'],['PG','Papua New Guinea'],['SB','Solomon Islands'],['NR','Nauru'],['TV','Tuvalu'],['VU','Vanuatu'],['FJ','Fiji'],['WS','Samoa'],['TO','Tonga'],['AU','Australia'],['NZ','New Zealand']];
const levels=[{id:'5',name:'Lived Here',points:5,color:'#FF7E7E'},{id:'4',name:'Stayed Here',points:4,color:'#FFB57E'},{id:'3',name:'Visited Here',points:3,color:'#FFE57E'},{id:'2',name:'Stopped Here',points:2,color:'#A8FFBE'},{id:'1',name:'Passed Here',points:1,color:'#88AEFF'},{id:'w',name:'Want to be Here',points:0,color:'#d6beff'},{id:'0',name:'Never been Here',points:0,color:'#ffffff'}];
const key='oceania-travel-levels-v2',byId=Object.fromEntries(levels.map(l=>[l.id,l]));
let state={},selected=null;
try{const saved=JSON.parse(localStorage.getItem(key)||'{}');for(const [code] of countries)if(saved&&Object.hasOwn(byId,saved[code]))state[code]=saved[code];}catch{}
const $=id=>document.getElementById(id);
function summary(){return {score:countries.reduce((n,[c])=>n+byId[state[c]||'0'].points,0),visited:countries.filter(([c])=>byId[state[c]||'0'].points>=3).length};}
function persist(){try{localStorage.setItem(key,JSON.stringify(state));$('notice').textContent='';}catch{$('notice').textContent='Your browser could not save progress. You can still download your chart.';}}
function render(){
 for(const [code,name] of countries){const level=byId[state[code]||'0'];const group=document.querySelector('[data-country="'+code+'"]');group.setAttribute('aria-label',name+': '+level.name+'. Choose travel level.');for(const shape of group.querySelectorAll('.region,.continent,.island'))shape.setAttribute('fill',level.color);}
 const title='Oceania Level '+summary().score;$('map-total').textContent=title;document.title=title;
}
function setLevel(code,id){if(!countries.some(([c])=>c===code)||!Object.hasOwn(byId,id))throw new Error('Unknown country or level');state[code]=id;persist();render();return {country:code,level:id,...summary()};}
function openCountry(code,event){selected=code;$('picker-title').textContent=countries.find(([c])=>c===code)[1];$('choices').replaceChildren(...levels.map(l=>{const b=document.createElement('button');b.className='choice l'+l.id;b.setAttribute('aria-pressed',String((state[code]||'0')===l.id));b.innerHTML=`<span>${l.name}</span><span>${l.points} ${l.points===1?'point':'points'}</span>`;b.onclick=()=>{setLevel(selected,l.id);$('picker').close();document.querySelector(`[data-country="${code}"]`).focus();};return b;}));const picker=$('picker');if(!picker.open)picker.show();const box=picker.getBoundingClientRect();const anchor=document.querySelector('[data-country="'+code+'"]').getBoundingClientRect();const x=event?.clientX??anchor.x+anchor.width/2;const y=event?.clientY??anchor.y+anchor.height/2;picker.style.left=Math.max(10,Math.min(x+12,window.innerWidth-box.width-10))+'px';picker.style.top=Math.max(10,Math.min(y+12,window.innerHeight-box.height-10))+'px';}
for(const group of document.querySelectorAll('[data-country]')){group.onclick=e=>{e.stopPropagation();openCountry(group.dataset.country,e);};group.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openCountry(group.dataset.country);}};}
for(const b of document.querySelectorAll('[data-close]'))b.onclick=()=>b.closest('dialog').close();
for(const dialog of document.querySelectorAll('dialog'))dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close();}});
$('reset').onclick=()=>$('reset-dialog').showModal();$('confirm-reset').onclick=()=>{state={};persist();render();$('reset-dialog').close();$('reset').focus();};
$('map-legend').innerHTML=levels.map((l,i)=>'<rect x="0" y="'+i*24+'" width="220" height="24" fill="'+l.color+'" stroke="#111" stroke-width="1"/><text x="8" y="'+(i*24+17)+'" font-family="Arial,sans-serif" font-size="16" fill="#111">'+l.name+'</text><text x="212" y="'+(i*24+17)+'" text-anchor="end" font-family="Arial,sans-serif" font-size="16" fill="#111">'+l.points+' pts</text>').join('');
const backgrounds=['#F9CDC7','#C5F9CB','#CDE8F4','#FDE8C4','#D0DCD7','#E1CEF5','#D6D6D6'];let backgroundIndex=0;try{const saved=localStorage.getItem('oceania-background');const i=backgrounds.indexOf(saved);if(i>=0)backgroundIndex=i;}catch{}
function paintBackground(){const color=backgrounds[backgroundIndex];$('map-background').setAttribute('fill',color);document.documentElement.style.backgroundColor=color;document.body.style.backgroundColor=color;}
paintBackground();document.addEventListener('click',e=>{if(e.target.closest('[data-country],dialog,footer,a,button'))return;if($('picker').open){$('picker').close();return;}backgroundIndex=(backgroundIndex+1+Math.floor(Math.random()*(backgrounds.length-1)))%backgrounds.length;paintBackground();try{localStorage.setItem('oceania-background',backgrounds[backgroundIndex]);}catch{}});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('picker').open)$('picker').close();});
function wrapped(ctx,text,x,y,width,lineHeight){let line='',offset=0;for(const word of text.split(' ')){const next=line?line+' '+word:word;if(ctx.measureText(next).width>width&&line){ctx.fillText(line,x,y+offset);offset+=lineHeight;line=word;}else line=next;}ctx.fillText(line,x,y+offset);}
async function exportChart(){const svg=$('oceania-map').cloneNode(true);svg.setAttribute('width','1350');svg.setAttribute('height','760');const url=URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(svg)],{type:'image/svg+xml;charset=utf-8'}));try{const image=new Image();image.src=url;await image.decode();const canvas=document.createElement('canvas');canvas.width=2025;canvas.height=1140;canvas.getContext('2d').drawImage(image,0,0,2025,1140);return canvas.toDataURL('image/png');}finally{URL.revokeObjectURL(url);}}
$('save').onclick=async()=>{const button=$('save');button.disabled=true;button.textContent='Creating image…';try{const url=await exportChart();$('save-image').src=url;$('download-link').href=url;$('save-dialog').showModal();}catch{$('notice').textContent='Could not create the image. Please try again.';}finally{button.disabled=false;button.textContent='Save';}};
render();
if(document.modelContext?.registerTool){const lifecycle=new AbortController();window.addEventListener('pagehide',()=>lifecycle.abort(),{once:true});for(const tool of [{name:'read_oceania_travel_levels',description:'Read the travel levels for all 14 sovereign countries and the total score.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true,untrustedContentHint:false},execute:()=>({countries:countries.map(([code,name])=>({code,name,level:state[code]||'0'})),...summary()})},{name:'set_oceania_travel_levels',description:'Set travel levels for one or more countries and save them in this browser. Levels: 0 Never been Here, w Want to be Here, 1 Passed Here, 2 Stopped Here, 3 Visited Here, 4 Stayed Here, 5 Lived Here.',inputSchema:{type:'object',properties:{updates:{type:'array',minItems:1,items:{type:'object',properties:{country:{type:'string',enum:countries.map(([c])=>c)},level:{type:'string',enum:levels.map(l=>l.id)}},required:['country','level'],additionalProperties:false}}},required:['updates'],additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:false},execute:input=>{if(!input||!Array.isArray(input.updates)||!input.updates.length||input.updates.some(u=>!u||!countries.some(([c])=>c===u.country)||!Object.hasOwn(byId,u.level)))throw new Error('Invalid travel levels');for(const u of input.updates)state[u.country]=u.level;persist();render();return summary();}}])try{Promise.resolve(document.modelContext.registerTool(tool,{signal:lifecycle.signal})).catch(()=>{});}catch{}}
</script></body></html>
